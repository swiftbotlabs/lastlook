# Last Look · Cloudflare Worker (Swift Bot Labs)
# Secrets (set as Worker secrets, never in this file): BUFFER_CLIENT_ID, BUFFER_CLIENT_SECRET, SESSION_SECRET
name = "lastlook"
main = "src/index.js"
compatibility_date = "2026-10-01"
# route every outbound fetch() as a public-internet request (link checks never take internal shortcuts)
compatibility_flags = ["global_fetch_strictly_public"]
account_id = "14921b4b1158675445e98816b6a01992"
workers_dev = true
preview_urls = false

[assets]
directory = "public"

# No request logs are stored: Cloudflare Workers Logs and invocation logs are off.
[observability]
enabled = false

[[kv_namespaces]]
binding = "SESSIONS"
id = "87c3dab55170438f8e8ba7b5d96f4206"

# The gate: one-session-per-account registry, app-wide Buffer allowance, per-account budgets, link limits
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

# The daily digest (opt-in): subscriptions, sealed read-only refresh tokens, the last 7 digests; one build per alarm
[[durable_objects.bindings]]
name = "DIGEST"
class_name = "Digest"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Digest"]

# Wakes the digest's alarm loop every hour (a backstop: the alarms themselves persist)
[triggers]
crons = ["7 * * * *"]

# Per-IP limits, checked before any session lookup (Workers rate limiting binding; period must be 10 or 60 s)
[[ratelimits]]
name = "RL_IP"
namespace_id = "41005"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "41001"
simple = { limit = 10, period = 60 }
